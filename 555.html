<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>鄭雨絲 · 淡粉色星空AR展廳 · 臥遊</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', '華文細黑', 'PingFang TC', 'Microsoft YaHei', sans-serif;
      background: #fdf0f5;
      touch-action: none;
    }
    #info {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #8a5a75;
      font-size: 14px;
      letter-spacing: 2px;
      background: rgba(255, 240, 248, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 20px;
      width: fit-content;
      margin: 0 auto;
      border-radius: 60px;
      border: 1px solid rgba(240, 180, 210, 0.4);
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 6px rgba(255, 220, 235, 0.5);
      box-shadow: 0 4px 20px rgba(220, 150, 180, 0.15);
    }
    #info span { opacity: 0.7; font-weight: 300; }
    @media (max-width: 600px) { 
      #info { font-size: 11px; padding: 4px 14px; bottom: 12px; letter-spacing: 1px; }
    }

    #loading {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #fdf0f5;
      display: flex; align-items: center; justify-content: center;
      color: #d890b5; font-size: 20px; letter-spacing: 6px;
      z-index: 999; transition: opacity 0.8s ease;
      pointer-events: none; font-weight: 300;
      text-shadow: 0 2px 12px rgba(230, 160, 195, 0.3);
    }
    #loading.hide { opacity: 0; }

    /* ===== AR 掃描提示條 ===== */
    #ar-banner {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, 
        rgba(255, 200, 225, 0.8), 
        rgba(255, 215, 235, 0.8), 
        rgba(245, 195, 230, 0.8), 
        rgba(255, 210, 232, 0.8),
        rgba(255, 200, 225, 0.8));
      background-size: 300% 100%;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 22px;
      border-radius: 40px;
      color: #9a5a80;
      font-size: 13px;
      letter-spacing: 3px;
      border: 1px solid rgba(245, 190, 220, 0.5);
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(220, 150, 190, 0.2);
      text-shadow: 0 1px 4px rgba(255, 230, 245, 0.7);
      animation: arPulse 3s ease-in-out infinite, arRainbow 8s linear infinite;
      white-space: nowrap;
    }
    @keyframes arPulse {
      0%, 100% { opacity: 0.85; box-shadow: 0 4px 20px rgba(220, 150, 190, 0.2); }
      50% { opacity: 1; box-shadow: 0 4px 30px rgba(240, 160, 210, 0.4); }
    }
    @keyframes arRainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    @media (max-width: 600px) { 
      #ar-banner { font-size: 10px; padding: 4px 14px; letter-spacing: 2px; top: 14px; }
    }

    /* ===== 作品詳情彈窗 (臥遊) ===== */
    #detail-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(60, 35, 50, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      animation: fadeIn 0.4s ease;
      padding: 12px;
    }
    #detail-overlay.active { display: flex; }
    #detail-box {
      background: rgba(255, 248, 252, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 28px;
      max-width: 1100px;
      width: 100%;
      max-height: 94vh;
      overflow-y: auto;
      padding: 20px 22px 22px 22px;
      box-shadow: 0 30px 80px rgba(120, 60, 90, 0.4), 0 0 0 1px rgba(245, 190, 220, 0.3);
      position: relative;
      border: 1px solid rgba(245, 200, 225, 0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }
    #detail-close {
      position: sticky;
      top: 0;
      align-self: flex-end;
      background: rgba(220, 150, 190, 0.15);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      color: #8a5a75;
      font-size: 28px;
      width: 44px; height: 44px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(230, 170, 205, 0.3);
      flex-shrink: 0;
      margin-bottom: 2px;
      z-index: 5;
      touch-action: manipulation;
    }
    #detail-close:hover, #detail-close:active { background: rgba(230, 170, 205, 0.3); transform: scale(1.05); }

    #detail-content {
      display: flex;
      flex-direction: row;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #detail-image-area {
      flex: 1 1 380px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    #detail-main-img {
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(120, 60, 90, 0.2);
      background: #2a1825;
      object-fit: contain;
      max-height: 420px;
      min-height: 200px;
      border: 1px solid rgba(240, 190, 215, 0.3);
      cursor: zoom-in;
      transition: transform 0.2s;
      touch-action: manipulation;
    }
    #detail-main-img:active { transform: scale(0.98); }

    /* AR 光效層 - 淡粉色 */
    .ar-glow-effect {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 18px;
      pointer-events: none;
      background: radial-gradient(circle at 30% 20%, rgba(255, 200, 225, 0.15), transparent 60%),
                  radial-gradient(circle at 70% 80%, rgba(250, 190, 220, 0.12), transparent 50%),
                  radial-gradient(circle at 50% 50%, rgba(240, 200, 235, 0.1), transparent 70%);
      animation: arGlow 4s ease-in-out infinite alternate;
      z-index: 3;
    }
    @keyframes arGlow {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    #detail-thumbs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .thumb-img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      background: #f5d8e8;
      box-shadow: 0 2px 8px rgba(180, 100, 140, 0.1);
      touch-action: manipulation;
    }
    .thumb-img:hover, .thumb-img:active { border-color: #e0a0c5; transform: scale(1.04); }
    .thumb-img.active { border-color: #d080b0; box-shadow: 0 0 0 2px #f0b8d8; }

    #detail-text {
      flex: 1 1 300px;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #5a3a4a;
    }
    #detail-text h2 {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 2px;
      color: #5a3a4a;
      border-bottom: 2px solid rgba(240, 190, 215, 0.4);
      padding-bottom: 6px;
      word-break: break-word;
    }
    #detail-text .sub {
      font-size: 13px;
      color: #a07088;
      letter-spacing: 1px;
      margin-top: -2px;
    }
    #detail-text .concept {
      font-size: 15px;
      line-height: 1.8;
      color: #5a3a4a;
      background: rgba(255, 235, 245, 0.6);
      padding: 14px 16px;
      border-radius: 16px;
      border-left: 3px solid #f0b0d0;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-overflow-scrolling: touch;
    }
    #detail-text .concept-en {
      font-size: 14px;
      line-height: 1.7;
      color: #7a5a6a;
      background: rgba(250, 240, 248, 0.5);
      padding: 12px 16px;
      border-radius: 16px;
      border-left: 3px solid #e0a0c5;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-overflow-scrolling: touch;
      font-style: italic;
    }
    #detail-text .concept::-webkit-scrollbar, #detail-text .concept-en::-webkit-scrollbar { width: 4px; }
    #detail-text .concept::-webkit-scrollbar-track, #detail-text .concept-en::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 8px; }
    #detail-text .concept::-webkit-scrollbar-thumb, #detail-text .concept-en::-webkit-scrollbar-thumb { background: #e0a0c5; border-radius: 8px; }

    .detail-footer {
      font-size: 12px;
      color: #b090a0;
      text-align: right;
      border-top: 1px solid rgba(240, 190, 215, 0.3);
      padding-top: 10px;
      margin-top: 2px;
    }
    .lang-tag {
      font-size: 11px;
      color: #b08098;
      background: rgba(240, 190, 215, 0.2);
      padding: 2px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-right: 6px;
      font-weight: 400;
    }

    @media (max-width: 700px) {
      #detail-box { padding: 16px 14px; max-height: 96vh; border-radius: 24px; }
      #detail-content { flex-direction: column; gap: 14px; }
      #detail-image-area { flex: 1 1 auto; min-width: 0; }
      #detail-main-img { max-height: 300px; min-height: 160px; border-radius: 14px; }
      #detail-text h2 { font-size: 20px; }
      #detail-text .concept { font-size: 14px; max-height: 180px; padding: 12px 14px; }
      #detail-text .concept-en { font-size: 13px; max-height: 160px; padding: 10px 14px; }
      .thumb-img { width: 52px; height: 52px; }
      #detail-close { width: 38px; height: 38px; font-size: 22px; }
    }
    @media (max-width: 400px) {
      #detail-box { padding: 12px 10px; }
      #detail-main-img { max-height: 220px; min-height: 120px; }
      #detail-text h2 { font-size: 18px; }
      #detail-text .concept { font-size: 13px; max-height: 150px; }
      #detail-text .concept-en { font-size: 12px; max-height: 140px; }
      .thumb-img { width: 44px; height: 44px; }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .click-hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #9a5a80;
      background: rgba(255, 240, 248, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 13px;
      letter-spacing: 2px;
      border: 1px solid rgba(240, 180, 210, 0.3);
      pointer-events: none;
      z-index: 10;
      opacity: 0.9;
      white-space: nowrap;
    }
    @media (max-width: 600px) { 
      .click-hint { bottom: 70px; font-size: 11px; padding: 4px 14px; letter-spacing: 1px; }
    }
    @media (max-width: 400px) { 
      .click-hint { bottom: 62px; font-size: 10px; padding: 3px 12px; }
    }
  </style>
</head>
<body>
  <div id="loading">✦ 載入淡粉色星空 ✦</div>
  <div id="ar-banner">✨ AR 增強實境 · 淡粉色星空藝術體驗 ✨</div>
  <div id="info">🖱️ 拖拽旋轉 · 滾輪縮放 · 點擊畫作臥遊 🏞️ <span>「 鄭雨絲 · 淡粉色星空AR 」</span></div>
  <div class="click-hint">👆 點擊畫作 · 臥遊細節</div>

  <!-- 詳情彈窗 -->
  <div id="detail-overlay">
    <div id="detail-box">
      <button id="detail-close" aria-label="關閉">✕</button>
      <div id="detail-content">
        <div id="detail-image-area">
          <img id="detail-main-img" src="" alt="作品主圖">
          <div class="ar-glow-effect"></div>
          <div id="detail-thumbs"></div>
        </div>
        <div id="detail-text">
          <h2 id="detail-title">作品名</h2>
          <div class="sub" id="detail-sub">尺寸 · 年份</div>
          <div class="concept" id="detail-concept"><span class="lang-tag">中文</span>創作理念載入中...</div>
          <div class="concept-en" id="detail-concept-en"><span class="lang-tag">English</span>Loading...</div>
          <div class="detail-footer">👆 點擊主圖可縮放 · 縮略圖切換局部</div>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- DOM refs ---
    const detailOverlay = document.getElementById('detail-overlay');
    const detailClose = document.getElementById('detail-close');
    const detailMainImg = document.getElementById('detail-main-img');
    const detailTitle = document.getElementById('detail-title');
    const detailSub = document.getElementById('detail-sub');
    const detailConcept = document.getElementById('detail-concept');
    const detailConceptEn = document.getElementById('detail-concept-en');
    const detailThumbs = document.getElementById('detail-thumbs');

    // --- 1. 場景 (淡粉色星空漸變背景) ---
    const scene = new THREE.Scene();
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    
    // 淡粉色星空漸變 - 從淺粉到淡粉紫再到近白
    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, '#fce8f0');      // 極淺粉
    gradient.addColorStop(0.2, '#fad8e8');    // 淺粉
    gradient.addColorStop(0.4, '#f5c8e0');    // 粉紅
    gradient.addColorStop(0.6, '#f0b8d8');    // 玫瑰粉
    gradient.addColorStop(0.8, '#e8b0d5');    // 淡粉紫
    gradient.addColorStop(1, '#e0a8d0');      // 粉紫
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 淡粉色星雲效果
    const nebulaColors = [
      'rgba(255, 210, 235, 0.2)',
      'rgba(250, 195, 225, 0.18)',
      'rgba(240, 200, 240, 0.15)',
      'rgba(255, 220, 240, 0.2)',
      'rgba(245, 200, 230, 0.18)',
      'rgba(235, 195, 235, 0.15)'
    ];
    
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const radius = 120 + Math.random() * 350;
      const nebulaGrad = ctx.createRadialGradient(x, y, 0, x, y, radius);
      nebulaGrad.addColorStop(0, nebulaColors[i % nebulaColors.length]);
      nebulaGrad.addColorStop(0.4, 'rgba(250, 210, 235, 0.08)');
      nebulaGrad.addColorStop(0.7, 'rgba(240, 190, 230, 0.04)');
      nebulaGrad.addColorStop(1, 'rgba(220, 170, 220, 0)');
      ctx.fillStyle = nebulaGrad;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // 水彩暈染效果
    for (let i = 0; i < 20; i++) {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const w = 180 + Math.random() * 320;
      const h = 180 + Math.random() * 320;
      const watercolorGrad = ctx.createRadialGradient(x, y, 0, x, y, Math.max(w, h));
      watercolorGrad.addColorStop(0, 'rgba(255, 220, 240, 0.12)');
      watercolorGrad.addColorStop(0.5, 'rgba(250, 200, 235, 0.06)');
      watercolorGrad.addColorStop(1, 'rgba(240, 180, 225, 0)');
      ctx.fillStyle = watercolorGrad;
      ctx.beginPath();
      ctx.ellipse(x, y, w, h, Math.random() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // 繪製星星 - 淡粉色調
    for (let i = 0; i < 1300; i++) {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const r = Math.random() * 2.2 + 0.2;
      const brightness = Math.random() * 0.7 + 0.3;
      
      const starColors = [
        `rgba(255, 255, 255, ${brightness})`,
        `rgba(255, 230, 245, ${brightness * 0.95})`,
        `rgba(255, 215, 240, ${brightness * 0.9})`,
        `rgba(250, 225, 250, ${brightness * 0.92})`,
        `rgba(255, 240, 250, ${brightness * 0.98})`
      ];
      ctx.fillStyle = starColors[Math.floor(Math.random() * starColors.length)];
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      
      // 大星星加光暈
      if (r > 1.6) {
        const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, r * 8);
        glowGrad.addColorStop(0, `rgba(255, 240, 250, ${brightness * 0.5})`);
        glowGrad.addColorStop(0.5, `rgba(250, 200, 235, ${brightness * 0.2})`);
        glowGrad.addColorStop(1, 'rgba(240, 180, 225, 0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(x, y, r * 8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    // 閃亮大星（帶星芒）
    for (let i = 0; i < 45; i++) {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const r = Math.random() * 3.5 + 1.5;
      const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, r * 12);
      glowGrad.addColorStop(0, 'rgba(255, 250, 255, 0.95)');
      glowGrad.addColorStop(0.2, 'rgba(255, 230, 245, 0.6)');
      glowGrad.addColorStop(0.5, 'rgba(245, 200, 235, 0.2)');
      glowGrad.addColorStop(1, 'rgba(235, 180, 225, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(x, y, r * 12, 0, Math.PI * 2);
      ctx.fill();
      
      // 星芒
      ctx.strokeStyle = 'rgba(255, 245, 252, 0.7)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(x - r * 5, y);
      ctx.lineTo(x + r * 5, y);
      ctx.moveTo(x, y - r * 5);
      ctx.lineTo(x, y + r * 5);
      ctx.stroke();
      
      // 對角星芒
      ctx.strokeStyle = 'rgba(255, 245, 252, 0.4)';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(x - r * 3.5, y - r * 3.5);
      ctx.lineTo(x + r * 3.5, y + r * 3.5);
      ctx.moveTo(x + r * 3.5, y - r * 3.5);
      ctx.lineTo(x - r * 3.5, y + r * 3.5);
      ctx.stroke();
    }
    
    scene.background = new THREE.CanvasTexture(canvas);
    scene.fog = new THREE.FogExp2(0xf8e0ec, 0.009);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.2, 11);
    camera.lookAt(0, 0.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.domElement.style.touchAction = 'none';
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    // --- 2. 控制器 (支援觸控) ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.6;
    controls.zoomSpeed = 0.8;
    controls.panSpeed = 0.4;
    controls.screenSpacePanning = true;
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 2.5;
    controls.maxDistance = 18;
    controls.target.set(0, 0.6, 0);
    controls.touchRotate = true;
    controls.touchZoom = true;
    controls.touchPan = true;

    // --- 3. 燈光 (淡粉色氛圍光) ---
    const ambientLight = new THREE.AmbientLight(0xf8d8e8, 0.85);
    scene.add(ambientLight);
    const mainLight = new THREE.DirectionalLight(0xfff0f8, 1.0);
    mainLight.position.set(3, 6, 6);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);
    const backLight = new THREE.DirectionalLight(0xe8d0f0, 0.6);
    backLight.position.set(-3, 2, -6);
    scene.add(backLight);
    const fillLight = new THREE.PointLight(0xf8c8e0, 0.5);
    fillLight.position.set(0, 3, 4);
    scene.add(fillLight);
    const bottomLight = new THREE.PointLight(0xd8b0d8, 0.35);
    bottomLight.position.set(0, -2, 2);
    scene.add(bottomLight);

    // AR 專用補光
    const arLight1 = new THREE.PointLight(0xf8c8e0, 0.45);
    arLight1.position.set(2, 1.5, 3);

        artParticlesPos[i+2] = z + (Math.random() - 0.5) * 1.5;
        const pc = starColors[Math.floor(Math.random() * starColors.length)];
        artParticlesCol[i] = pc[0];
        artParticlesCol[i+1] = pc[1];
        artParticlesCol[i+2] = pc[2];
      }
      artParticlesGeo.setAttribute('position', new THREE.BufferAttribute(artParticlesPos, 3));
      artParticlesGeo.setAttribute('color', new THREE.BufferAttribute(artParticlesCol, 3));
      const artParticlesMat = new THREE.PointsMaterial({
        size: 0.06,
        vertexColors: true,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending
      });
      const artParticles = new THREE.Points(artParticlesGeo, artParticlesMat);
      scene.add(artParticles);

      // 標籤 (CSS2D) - 帶淡粉色AR發光效果
      const labelDiv = document.createElement('div');
      labelDiv.style.color = '#8a5a75';
      labelDiv.style.fontFamily = '"Segoe UI", "華文細黑", "PingFang TC", sans-serif';
      labelDiv.style.textAlign = 'center';
      labelDiv.style.textShadow = '0 0 20px rgba(255,200,230,0.9), 0 0 40px rgba(240,180,220,0.5)';
      labelDiv.style.background = 'rgba(255, 245, 250, 0.7)';
      labelDiv.style.backdropFilter = 'blur(6px)';
      labelDiv.style.padding = '5px 14px 7px 14px';
      labelDiv.style.borderRadius = '40px';
      labelDiv.style.border = '1px solid rgba(245, 190, 220, 0.5)';
      labelDiv.style.pointerEvents = 'none';
      labelDiv.style.maxWidth = '200px';
      
      const titleSpan = document.createElement('div');
      titleSpan.style.fontSize = '17px';
      titleSpan.style.fontWeight = '500';
      titleSpan.style.letterSpacing = '1px';
      titleSpan.style.color = '#8a5a75';
      titleSpan.textContent = item.title;
      
      const descSpan = document.createElement('div');
      descSpan.style.fontSize = '11px';
      descSpan.style.fontWeight = '300';
      descSpan.style.color = '#b08098';
      descSpan.style.marginTop = '2px';
      descSpan.textContent = item.desc;
      
      labelDiv.appendChild(titleSpan);
      labelDiv.appendChild(descSpan);
      
      const label = new CSS2DObject(labelDiv);
      label.position.set(x, y - frameHeight/2 - 0.3, z);
      scene.add(label);

      const cardKey = canvas.uuid;
      const thumbUrls = generateThumbUrls(item.img);
      cardDataMap.set(cardKey, {
        imgUrl: item.img,
        title: item.title,
        desc: item.desc,
        concept: item.concept,
        conceptEn: item.conceptEn,
        thumbs: thumbUrls
      });

      cardMeshes.push({ 
        canvas, imgMesh, edge, glowEdge, label, artParticles,
        baseY: y, phase: index * 0.5, key: cardKey 
      });
    });

    // --- 7. 中心裝飾 (淡粉色AR風格) ---
    const centerLabelDiv = document.createElement('div');
    centerLabelDiv.style.color = '#8a5a75';
    centerLabelDiv.style.fontSize = '28px';
    centerLabelDiv.style.fontWeight = '200';
    centerLabelDiv.style.letterSpacing = '10px';
    centerLabelDiv.style.textShadow = '0 0 60px rgba(255, 200, 230, 0.7), 0 0 100px rgba(240, 180, 220, 0.4)';
    centerLabelDiv.style.background = 'rgba(255, 245, 250, 0.5)';
    centerLabelDiv.style.backdropFilter = 'blur(4px)';
    centerLabelDiv.style.padding = '8px 28px';
    centerLabelDiv.style.borderRadius = '60px';
    centerLabelDiv.style.border = '1px solid rgba(245, 190, 220, 0.4)';
    centerLabelDiv.textContent = '✦ 鄭雨絲 ✦';
    const centerLabel = new CSS2DObject(centerLabelDiv);
    centerLabel.position.set(0, 1.9, -2.2);
    scene.add(centerLabel);

    // AR 中心光柱 (淡粉色)
    const pillarLightGeo = new THREE.CylinderGeometry(0.02, 0.02, 1.5, 8);
    const pillarLightMat = new THREE.MeshBasicMaterial({
      color: 0xf8c8e0,
      transparent: true,
      opacity: 0.2,
      blending: THREE.AdditiveBlending
    });
    const pillarLight = new THREE.Mesh(pillarLightGeo, pillarLightMat);
    pillarLight.position.set(0, 1.2, -2.2);
    scene.add(pillarLight);

    // 小立柱 (淡粉色裝飾)
    const pillarMat = new THREE.MeshStandardMaterial({ 
      color: 0xf0d0e0, 
      emissive: 0xd8b0c8, 
      roughness: 0.7, 
      metalness: 0.15 
    });
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const r = 6.0;
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.12, 0.3, 6), pillarMat);
      pillar.position.set(Math.sin(angle) * r, -0.5, Math.cos(angle) * r - 0.8);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      scene.add(pillar);
    }
    const glowLight = new THREE.PointLight(0xf0b8d8, 0.3);
    glowLight.position.set(0, 1, -1);
    scene.add(glowLight);

    // --- 8. 點擊交互 (支援觸控) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let currentMainUrl = '';

    function openDetail(cardKey) {
      const data = cardDataMap.get(cardKey);
      if (!data) return;
      
      currentMainUrl = data.imgUrl;
      detailMainImg.src = currentMainUrl;
      detailTitle.textContent = data.title;
      detailSub.textContent = data.desc;
      detailConcept.innerHTML = `<span class="lang-tag">中文</span>${data.concept || '暫無創作理念'}`;
      detailConceptEn.innerHTML = `<span class="lang-tag">English</span>${data.conceptEn || 'No concept available'}`;

      detailThumbs.innerHTML = '';
      const thumbs = data.thumbs || [data.imgUrl];
      thumbs.forEach((thumbUrl, idx) => {
        const thumb = document.createElement('img');
        thumb.className = 'thumb-img';
        thumb.src = thumbUrl;
        thumb.alt = `局部${idx+1}`;
        thumb.dataset.url = thumbUrl;
        if (idx === 0) thumb.classList.add('active');
        thumb.addEventListener('click', (e) => {
          e.stopPropagation();
          currentMainUrl = thumbUrl;
          detailMainImg.src = thumbUrl;
          document.querySelectorAll('.thumb-img').forEach(el => el.classList.remove('active'));
          thumb.classList.add('active');
        });
        thumb.addEventListener('touchend', (e) => {
          e.preventDefault();
          e.stopPropagation();
          currentMainUrl = thumbUrl;
          detailMainImg.src = thumbUrl;
          document.querySelectorAll('.thumb-img').forEach(el => el.classList.remove('active'));
          thumb.classList.add('active');
        });
        detailThumbs.appendChild(thumb);
      });

      detailOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
      detailOverlay.classList.remove('active');
      document.body.style.overflow = '';
      detailMainImg.src = '';
      detailThumbs.innerHTML = '';
    }

    function handlePointer(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      let clientX, clientY;
      if (event.touches) {
        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;
        event.preventDefault();
      } else {
        clientX = event.clientX;
        clientY = event.clientY;
      }
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const meshes = cardMeshes.map(item => item.canvas);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        const cardKey = hitMesh.uuid;
        if (cardDataMap.has(cardKey)) {
          openDetail(cardKey);
        }
      }
    }

    renderer.domElement.addEventListener('click', handlePointer);
    renderer.domElement.addEventListener('touchstart', handlePointer, { passive: false });

    detailClose.addEventListener('click', closeDetail);
    detailClose.addEventListener('touchend', (e) => { e.preventDefault(); closeDetail(); });
    detailOverlay.addEventListener('click', (e) => {
      if (e.target === detailOverlay) closeDetail();
    });
    detailOverlay.addEventListener('touchend', (e) => {
      if (e.target === detailOverlay) { e.preventDefault(); closeDetail(); }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetail();
    });

    // 主圖點擊縮放 (移動端友善)
    let zoomed = false;
    detailMainImg.addEventListener('click', () => {
      if (zoomed) {
        detailMainImg.style.transform = 'scale(1)';
        detailMainImg.style.cursor = 'zoom-in';
        zoomed = false;
      } else {
        detailMainImg.style.transform = 'scale(1.4)';
        detailMainImg.style.cursor = 'zoom-out';
        zoomed = true;
      }
    });
    detailMainImg.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (zoomed) {
        detailMainImg.style.transform = 'scale(1)';
        detailMainImg.style.cursor = 'zoom-in';
        zoomed = false;
      } else {
        detailMainImg.style.transform = 'scale(1.4)';
        detailMainImg.style.cursor = 'zoom-out';
        zoomed = true;
      }
    });

    // --- 9. 動畫循環 (淡粉色AR動態效果) ---
    function animate() {
      const elapsedTime = performance.now() * 0.001;

      cardMeshes.forEach((item, idx) => {
        // 浮動效果
        const offsetY = Math.sin(elapsedTime * 0.4 + idx * 0.6) * 0.025;
        const baseY = 0.2 + Math.sin((idx / cardMeshes.length) * 6.28 * 0.5) * 0.3;
        const newY = baseY + offsetY;
        item.canvas.position.y = newY;
        item.imgMesh.position.y = newY;
        item.edge.position.y = newY;
        item.glowEdge.position.y = newY;
        item.label.position.y = newY - 0.25;

        // AR 光暈呼吸效果
        if (item.glowEdge) {
          const pulse = 0.3 + Math.sin(elapsedTime * 1.5 + idx) * 0.2;
          item.glowEdge.material.opacity = pulse;
        }

        // AR 粒子環繞
        if (item.artParticles) {
          item.artParticles.rotation.y += 0.002;
          item.artParticles.rotation.x += 0.001;
        }
      });

      // 地面光環動畫 (三層)
      ring.rotation.z += 0.001;
      ring2.rotation.z -= 0.0008;
      ring3.rotation.z += 0.0005;
      ring.material.opacity = 0.18 + Math.sin(elapsedTime * 0.8) * 0.08;
      ring2.material.opacity = 0.12 + Math.sin(elapsedTime * 0.6) * 0.05;
      ring3.material.opacity = 0.08 + Math.sin(elapsedTime * 0.5) * 0.04;

      // 粒子系統動態
      particles.rotation.y += 0.00015;
      arDots.rotation.y -= 0.00025;

      // 中心光柱脈衝
      pillarLight.material.opacity = 0.15 + Math.sin(elapsedTime * 2) * 0.1;

      controls.update();

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // --- 10. 自適應 ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 防止觸控滾動干擾
    document.addEventListener('touchmove', (e) => {
      if (e.target === renderer.domElement) e.preventDefault();
    }, { passive: false });

    setTimeout(() => {
      document.getElementById('loading')?.classList.add('hide');
    }, 500);

    console.log('🌸 淡粉色星空AR展廳已啟動 | 點擊畫作查看細節與理念 (支援手機觸控)');
  </script>
</body>
</html>
