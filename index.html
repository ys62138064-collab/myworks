<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首页 · 求职招聘 App UI 展示</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="stage-bar">
    <span class="stage-title">求职招聘 App · UI 高保真展示</span>
    <nav class="stage-nav">
      <a href="index.html" class="active">首页</a>
      <a href="job-detail.html">职位详情</a>
      <a href="messages.html">消息</a>
    </nav>
  </header>

  <main class="stage-body">
    <section class="phone">
      <div class="screen">

        <!-- 状态栏 -->
        <div class="statusbar">
          <span>9:41</span>
          <svg width="46" height="12" viewBox="0 0 46 12" fill="currentColor">
            <rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/>
            <rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/>
            <path d="M25 4c2.6-2.3 6.4-2.3 9 0l-1.5 1.7a4.6 4.6 0 0 0-6 0L25 4zm2.4 2.7a3 3 0 0 1 4.2 0L29.5 9l-2.1-2.3z"/>
            <rect x="38" y="2" width="7" height="10" rx="2" fill="none" stroke="currentColor"/>
            <rect x="39.5" y="3.5" width="4" height="7" rx="1"/>
          </svg>
        </div>

        <!-- 页面内容 -->
        <div class="page">
          <div class="loc-row">
            <span class="loc">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
              </svg>
              北京 · 朝阳区
            </span>
            <button class="icon-btn" title="通知">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
              </svg>
              <i class="dot"></i>
            </button>
          </div>

          <div class="home-hero">
            <h1>找到心仪的工作</h1>
            <p class="sub">已有 <b>9781</b> 家企业上架最新职位</p>
          </div>

          <div class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input type="text" placeholder="搜索职位、公司或技能" />
            <button class="search-go" title="筛选">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"/>
                <circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>
              </svg>
            </button>
          </div>

          <div class="quick-grid">
            <a class="quick" href="job-detail.html">
              <span class="q-ico">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M15 9h4a2 2 0 0 1 2 2v10"/>
                  <path d="M8 7h3M8 11h3M8 15h3"/>
                </svg>
              </span>国企
            </a>
            <a class="quick" href="job-detail.html">
              <span class="q-ico green">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/>
                </svg>
              </span>编制
            </a>
            <a class="quick" href="job-detail.html">
              <span class="q-ico purple">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 9 12 4 2 9l10 5 10-5z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v5"/>
                </svg>
              </span>实习
            </a>
            <a class="quick" href="job-detail.html">
              <span class="q-ico orange">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2c1 3-1 4.5-2.5 6C8 9.5 7 11 7 13a5 5 0 0 0 10 0c0-1.5-.5-2.7-1.5-4-.3 1-.8 1.7-1.5 2 .3-2.5-.5-6-2-9z"/>
                </svg>
              </span>高薪直招
            </a>
          </div>

          <div class="section-head">
            <h2>推荐职位</h2>
            <a href="job-detail.html">查看全部 ›</a>
          </div>

          <a class="job-card" href="job-detail.html">
            <div class="job-top"><h3>高级前端工程师</h3><span class="salary">25-40K·14薪</span></div>
            <p class="job-meta">星野科技 · 互联网 · 500-999人</p>
            <div class="tags"><span>五险一金</span><span>双休</span><span>朝九晚五</span></div>
            <div class="job-foot"><span>发布于 · 北京</span><span>10分钟前</span></div>
          </a>

          <a class="job-card" href="job-detail.html">
            <div class="job-top"><h3>产品运营实习生</h3><span class="salary">160-220/天</span></div>
            <p class="job-meta">快充文化 · 传媒 · 50-99人</p>
            <div class="tags"><span>转正机会</span><span>可实习</span><span>弹性工作</span></div>
            <div class="job-foot"><span>发布于 · 成都</span><span>15分钟前</span></div>
          </a>
        </div>

        <!-- 底部 TabBar -->
        <nav class="tabbar">
          <a class="tab active" href="index.html">
            <span class="tab-ico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-7h6v7"/>
              </svg>
            </span>首页
          </a>
          <a class="tab" href="job-detail.html">
            <span class="tab-ico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </span>职位
          </a>
          <a class="tab" href="messages.html">
            <span class="tab-ico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a8 8 0 0 1-8 8H4l2.5-2.5A8 8 0 1 1 21 12z"/>
              </svg>
            </span>消息
          </a>
          <a class="tab" href="index.html">
            <span class="tab-ico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>
              </svg>
            </span>我的
          </a>
        </nav>

      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
